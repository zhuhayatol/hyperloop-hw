[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloop-ascend"
version = "0.1.0"
description = "Session-oriented SGLang optimization with replaceable execution backends"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
hyperloop = "hyperloop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
